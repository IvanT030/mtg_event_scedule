name: Scrape FB posts

on:
  workflow_dispatch:
    inputs:
      page:
        description: "粉專網址或帳號（多個用逗號分隔；留空則用 pages.txt）"
        required: false
        default: ""
      days:
        description: "往回抓幾天內的貼文"
        required: false
        default: "30"
  push:
    branches: [main]
    paths: ["pages.txt", "scraper/**", ".github/workflows/scrape.yml"]
  schedule:
    - cron: "17 22 * * *"   # 每天台灣時間 06:17

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape
        env:
          INPUT_PAGE: ${{ github.event.inputs.page }}
          INPUT_DAYS: ${{ github.event.inputs.days || '30' }}
        run: |
          if [ -n "$INPUT_PAGE" ]; then
            python scraper/fetch_posts.py --page "$INPUT_PAGE" --days "$INPUT_DAYS"
          else
            python scraper/fetch_posts.py --days "$INPUT_DAYS"
          fi

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: scrape $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q || true
          git push
